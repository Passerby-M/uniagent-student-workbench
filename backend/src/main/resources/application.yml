spring:
  application:
    name: facultyflow-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:facultyflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
flowable:
  database-schema-update: true
  async-executor-activate: false
server:
  port: ${SERVER_PORT:8080}
facultyflow:
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
